name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan basic
        run: |
          if rg -n --hidden \
            --glob '!.git' \
            --glob '!node_modules' \
            --glob '!.venv' \
            --glob '!.github/workflows/security.yml' \
            -e 'OPENAI_API_KEY=' \
            -e 'AWS_SECRET_ACCESS_KEY=' \
            -e '-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' \
            .; then
            echo "Potential secret detected"
            exit 1
          fi

      - name: Dependency audit Node
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend audit --audit-level high || true

      - name: Python dependency audit placeholder
        if: hashFiles('backend/pyproject.toml') != ''
        run: |
          echo "Add pip-audit or safety if Python project requires dependency audit."
