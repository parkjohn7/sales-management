name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'sales-management' }}
  GCP_BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE || 'sales-management-backend' }}
  GCP_FRONTEND_SERVICE: ${{ vars.GCP_FRONTEND_SERVICE || 'sales-management-frontend' }}
  GAR_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: cd backend && uv sync --extra dev

      - name: Verify
        run: make verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            sqladmin.googleapis.com

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" \
            --location "$GCP_REGION" >/dev/null 2>&1 \
          || gcloud artifacts repositories create "$GCP_ARTIFACT_REPOSITORY" \
            --repository-format docker \
            --location "$GCP_REGION" \
            --description "영업관리시스템 containers"

      - name: Configure Docker
        run: gcloud auth configure-docker "$GAR_HOST" --quiet

      - name: Build and push backend
        env:
          BACKEND_IMAGE: ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/sales-management-backend:${{ github.sha }}
        run: |
          docker build -t "$BACKEND_IMAGE" ./backend
          docker push "$BACKEND_IMAGE"
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy backend
        run: |
          DEPLOY_ARGS=(
            run deploy "$GCP_BACKEND_SERVICE"
            --image "$BACKEND_IMAGE"
            --region "$GCP_REGION"
            --platform managed
            --allow-unauthenticated
            --port 8000
            --set-env-vars "APP_ENV=prod"
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            --set-env-vars "DEV_TOKEN_SECRET=${{ secrets.DEV_TOKEN_SECRET }}"
            --set-env-vars "INTEGRATION_API_KEY=${{ secrets.INTEGRATION_API_KEY }}"
            --set-env-vars "^~^CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173"
          )
          if [ -n "${{ vars.GCP_CLOUD_SQL_INSTANCE }}" ]; then
            DEPLOY_ARGS+=(--add-cloudsql-instances "${{ vars.GCP_CLOUD_SQL_INSTANCE }}")
          fi
          gcloud "${DEPLOY_ARGS[@]}"
          BACKEND_URL="$(gcloud run services describe "$GCP_BACKEND_SERVICE" \
            --region "$GCP_REGION" \
            --format 'value(status.url)')"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"

      - name: Build and push frontend
        env:
          FRONTEND_IMAGE: ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/sales-management-frontend:${{ github.sha }}
        run: |
          docker build \
            --build-arg "VITE_API_BASE_URL=${BACKEND_URL}/api/v1" \
            -t "$FRONTEND_IMAGE" \
            ./frontend
          docker push "$FRONTEND_IMAGE"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy frontend
        run: |
          gcloud run deploy "$GCP_FRONTEND_SERVICE" \
            --image "$FRONTEND_IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
          FRONTEND_URL="$(gcloud run services describe "$GCP_FRONTEND_SERVICE" \
            --region "$GCP_REGION" \
            --format 'value(status.url)')"
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"

      - name: Update backend CORS
        run: |
          gcloud run services update "$GCP_BACKEND_SERVICE" \
            --region "$GCP_REGION" \
            --update-env-vars "^~^CORS_ORIGINS=${FRONTEND_URL},http://localhost:5173,http://127.0.0.1:5173"

      - name: Smoke test
        run: |
          curl --fail "${BACKEND_URL}/api/v1/health"
          curl --fail "${FRONTEND_URL}/healthz"

      - name: Deployment summary
        run: |
          echo "Backend:  ${BACKEND_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${FRONTEND_URL}" >> "$GITHUB_STEP_SUMMARY"
