name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_PROJECT_ID || 'sales-management-498110' }}
  GCP_REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || 'asia-northeast3' }}
  GAR_HOST: ${{ (vars.GCP_REGION != '' && vars.GCP_REGION || 'asia-northeast3') }}-docker.pkg.dev
  REPO: ${{ vars.GCP_ARTIFACT_REPOSITORY != '' && vars.GCP_ARTIFACT_REPOSITORY || 'sales-management-docker-repo' }}
  BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE != '' && vars.GCP_BACKEND_SERVICE || 'sales-management-backend' }}
  FRONTEND_SERVICE: ${{ vars.GCP_FRONTEND_SERVICE != '' && vars.GCP_FRONTEND_SERVICE || 'sales-management-frontend' }}
  CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE != '' && vars.GCP_CLOUD_SQL_INSTANCE || 'sales-management-498110:asia-northeast3:free-trial-first-project' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/57171998407/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_SERVICE_ACCOUNT || 'github-actions-deployer@sales-management-498110.iam.gserviceaccount.com' }}
  RETAIN_IMAGE_COUNT: ${{ vars.RETAIN_IMAGE_COUNT != '' && vars.RETAIN_IMAGE_COUNT || '5' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.GCP_REGION }}
          REPO: ${{ env.REPO }}
          BACKEND_SERVICE: ${{ env.BACKEND_SERVICE }}
          FRONTEND_SERVICE: ${{ env.FRONTEND_SERVICE }}
          CLOUD_SQL_INSTANCE: ${{ env.CLOUD_SQL_INSTANCE }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ env.GCP_SERVICE_ACCOUNT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_TOKEN_SECRET: ${{ secrets.DEV_TOKEN_SECRET }}
          INTEGRATION_API_KEY: ${{ secrets.INTEGRATION_API_KEY }}
        run: |
          missing=0
          for key in \
            GCP_PROJECT_ID \
            GCP_REGION \
            REPO \
            BACKEND_SERVICE \
            FRONTEND_SERVICE \
            WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            DATABASE_URL \
            DEV_TOKEN_SECRET \
            INTEGRATION_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing required Actions setting: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deployment target"
          echo "- project: ${GCP_PROJECT_ID}"
          echo "- region: ${GCP_REGION}"
          echo "- artifact repo: ${REPO}"
          echo "- backend service: ${BACKEND_SERVICE}"
          echo "- frontend service: ${FRONTEND_SERVICE}"
          echo "- cloud sql instance: ${CLOUD_SQL_INSTANCE}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: cd backend && uv sync --extra dev

      - name: Verify
        run: make verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation 필수

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Workload Identity Federation으로 GCP 인증 (JSON 키 불필요)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Artifact Registry 인증
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_HOST }} --quiet

      - name: Apply Artifact Registry Cleanup Policy
        env:
          GCP_BACKEND_SERVICE: ${{ env.BACKEND_SERVICE }}
          GCP_FRONTEND_SERVICE: ${{ env.FRONTEND_SERVICE }}
          KEEP_COUNT: ${{ env.RETAIN_IMAGE_COUNT }}
        run: bash scripts/gcp/apply-artifact-cleanup-policy.sh

      # ── Backend ──────────────────────────────────────────
      - name: Build & Push Backend Image
        run: |
          IMAGE="${{ env.GAR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.BACKEND_SERVICE }}"
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE}:prod" \
            -t "${IMAGE}:latest" \
            --push \
            ./backend
          echo "BACKEND_IMAGE=${IMAGE}:prod" >> $GITHUB_ENV

      - name: Deploy Backend to Cloud Run
        run: |
          CLOUDSQL_FLAG=""
          if [ -n "${{ env.CLOUD_SQL_INSTANCE }}" ]; then
            CLOUDSQL_FLAG="--set-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}"
          fi
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image="${{ env.BACKEND_IMAGE }}" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="APP_ENV=prod" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="DEV_TOKEN_SECRET=${{ secrets.DEV_TOKEN_SECRET }}" \
            --set-env-vars="INTEGRATION_API_KEY=${{ secrets.INTEGRATION_API_KEY }}" \
            --set-env-vars="^~^CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173" \
            ${CLOUDSQL_FLAG} \
            --service-account=${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Get Backend URL
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "BACKEND_URL=${URL}" >> $GITHUB_ENV
          echo "✅ Backend: ${URL}"

      # ── Frontend ─────────────────────────────────────────
      - name: Build & Push Frontend Image
        run: |
          IMAGE="${{ env.GAR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.FRONTEND_SERVICE }}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL="${{ env.BACKEND_URL }}/api/v1" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${IMAGE}:prod" \
            -t "${IMAGE}:latest" \
            --push \
            ./frontend
          echo "FRONTEND_IMAGE=${IMAGE}:prod" >> $GITHUB_ENV

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image="${{ env.FRONTEND_IMAGE }}" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5

      - name: Get Frontend URL
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "FRONTEND_URL=${URL}" >> $GITHUB_ENV
          echo "✅ Frontend: ${URL}"

      - name: Update Backend CORS
        run: |
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --update-env-vars="^~^CORS_ORIGINS=${{ env.FRONTEND_URL }},http://localhost:5173,http://127.0.0.1:5173"

      - name: Smoke Test
        run: |
          curl --fail "${{ env.BACKEND_URL }}/api/v1/health"
          curl --fail "${{ env.FRONTEND_URL }}/"
